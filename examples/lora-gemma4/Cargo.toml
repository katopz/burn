[package]
authors = ["burn contributors"]
edition.workspace = true
license.workspace = true
name = "lora-gemma4"
publish = false
version.workspace = true

[lints]
workspace = true

[features]
default = ["burn/tui"]
ndarray = ["burn/ndarray", "dep:burn-ndarray"]
ndarray-blas-accelerate = ["burn/ndarray", "burn/accelerate", "dep:burn-ndarray"]
ndarray-blas-netlib = ["burn/ndarray", "burn/blas-netlib", "dep:burn-ndarray"]
ndarray-blas-openblas = ["burn/ndarray", "burn/openblas", "dep:burn-ndarray"]
tch-cpu = ["burn/tch"]
tch-gpu = ["burn/tch"]
wgpu = ["burn/wgpu"]
cuda = ["burn/cuda", "burn/default"]
metal = ["burn/metal", "burn/default"]
vulkan = ["burn/vulkan", "burn/default"]
rocm = ["burn/rocm", "burn/default"]
remote = ["burn/remote", "burn/default"]

[dependencies]
burn = { path = "../../crates/burn", features = ["train", "tui"] }
burn-ndarray = { path = "../../crates/burn-ndarray", optional = true }
burn-store = { path = "../../crates/burn-store", features = ["std", "safetensors"] }
clap = { workspace = true, features = ["derive"] }
log = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true }
env_logger = "0.11"
tokenizers = { version = "0.22.2", default-features = false, features = [
    "onig",
    "http",
] }

[dev-dependencies]
burn-ndarray = { path = "../../crates/burn-ndarray" }
tempfile = { workspace = true }
